<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hello</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px;">

<!-- Tabs Header -->
<div style="
  overflow: hidden;
  border: 1px solid #ccc;
  background-color: #f1f1f1;
">

<button onclick="openTab(event, 'tab0')" style="
  background-color: inherit;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 14px 16px;
  transition: background-color 0.3s;
  font-size: 16px;
  display: inline-block;
" onmouseover="this.style.backgroundColor='#ddd'"
onmouseout="if(!this.classList.contains('active')) this.style.backgroundColor='inherit'">
1. Setup
</button>

<button onclick="openTab(event, 'tab1')" style="
  background-color: inherit;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 14px 16px;
  transition: background-color 0.3s;
  font-size: 16px;
  display: inline-block;
" onmouseover="this.style.backgroundColor='#ddd'"
onmouseout="if(!this.classList.contains('active')) this.style.backgroundColor='inherit'">
2. Step 2
</button>
</div>

<!-- Tabs Content -->

<div id="tab0" style="
  display: block;
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-top: none;
">
<h3 style="margin-top: 0;">Setup</h3>
<p>make sure you have vscode installed.</p>
<ul>
<li>install node.js</li>
<li>install git</li>
</ul>
<br/>
<br/>
<br/>
<ol>
<li>open vscode</li>
<li>start coding</li>
</ol>

</div>

<div id="tab1" style="
  display: none;
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-top: none;
">
<h3 style="margin-top: 0;">Step 2</h3>
<p>Step 1</p>
<br/>
<p>Fuckin nigger</p>

</div>

<script>
function openTab(evt, tabId) {
  var i, tabcontent, buttons;
  tabcontent = document.querySelectorAll('[id^="tab"]');
  buttons = document.querySelectorAll('button');
  tabcontent.forEach(el => el.style.display = "none");
  buttons.forEach(b => {
    b.classList.remove('active');
    b.style.backgroundColor = "inherit";
  });
  document.getElementById(tabId).style.display = "block";
  evt.currentTarget.classList.add('active');
  evt.currentTarget.style.backgroundColor = "#ccc";
}
</script>

</body>
</html>
